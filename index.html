<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prédictions Foot</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--bg:#F3F5EF;--ink:#14201A;--muted:#5B6A61;--home:#1E4D3A;--draw:#B9C2B8;--away:#C8462B;--card:#FFF;--line:#D9DFD6;--ok:#1E7A4A;--mid:#B57F00;--bad:#C8462B}
@media (prefers-color-scheme:dark){:root{--bg:#0F1712;--ink:#EAF0EA;--muted:#93A399;--home:#3A9670;--draw:#4A5A50;--away:#E0664A;--card:#17231C;--line:#2A3A30;--ok:#4CC58A;--mid:#E5B93C;--bad:#E0664A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 18px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar span{font-weight:700}
.topbar a{color:var(--muted);font-size:.85rem;text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:8px}
h1{font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.1;margin:22px 0 4px}
h2{font-size:1.15rem;margin:26px 0 8px}
.sub,.note{color:var(--muted);font-size:.92rem;margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
nav{display:flex;gap:8px;margin:14px 0}
nav button{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
nav button.on{background:var(--home);color:#fff;border-color:var(--home)}
.score{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.score b{font-size:2.2rem;color:var(--home)}
.m{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.t{font-weight:800;font-size:1.05rem;margin:2px 0 6px}
.mini{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-bottom:7px}
.mini.sec{background:var(--draw);color:var(--ink)}
.bar{display:flex;overflow:hidden;border-radius:8px;background:var(--line);height:26px;font-size:.85rem}
.lg .bar{height:54px;font-size:1.05rem}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.h{background:var(--home)}.d{background:var(--draw);color:var(--ink)!important}.a{background:var(--away)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;font-size:.9rem;margin-top:8px;color:var(--muted)}
.back{background:none;border:0;padding:6px 0;font-weight:600;color:var(--muted);margin-top:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 15px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.b{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;color:#fff;font-weight:700;font-size:.8rem;margin-right:4px}
.V{background:var(--ok)}.N{background:var(--mid)}.D{background:var(--bad)}
.src{font-size:.78rem;font-weight:700;padding:2px 7px;border-radius:99px}
.src.actuelle{background:var(--ok);color:#fff}.src.historique{background:var(--mid);color:#fff}
.tag{font-weight:700;font-size:.85rem;padding:3px 9px;border-radius:99px}
.tag.ok{background:var(--ok);color:#fff}.tag.bad{background:var(--bad);color:#fff}
.warn{margin-top:28px;padding:14px 16px;border-left:4px solid #F2B705;background:var(--card);font-size:.92rem;border-radius:0 10px 10px 0}
</style>
</head>
<body>
<main id="main" style="display:none">
<div class="topbar">
<span>Prédictions Foot</span>
<a href="#" id="deconnexion">Bonjour <span id="nomUser"></span> · Se déconnecter</a>
</div>
<nav>
<button id="tab-j" class="on">Matchs du jour</button>
<button id="tab-r">Résultats</button>
</nav>
<div id="app"><p class="sub">Chargement…</p></div>
<div class="warn"><b>Une prédiction est une probabilité, pas une certitude.</b> Le football reste imprévisible. Ces chiffres ne sont pas un conseil de paris.</div>
</main>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBkxmxGehi3FAl5wnncb9jYFAJ78Xq4NkM",
  authDomain: "vm-r-pronostic-football.firebaseapp.com",
  projectId: "vm-r-pronostic-football",
  storageBucket: "vm-r-pronostic-football.firebasestorage.app",
  messagingSenderId: "608079906919",
  appId: "1:608079906919:web:e3c10aad785303bd946cc2"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();

auth.onAuthStateChanged(function(u){
  if(!u){ window.location.href = "connexion.html"; return; }
  document.getElementById("nomUser").textContent = u.displayName || u.email;
  document.getElementById("main").style.display = "block";
  chargerDonnees();
});

document.getElementById("deconnexion").onclick = function(e){
  e.preventDefault();
  auth.signOut();
};

var D=null,app=document.getElementById("app"),vue="jour";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hr(d){return new Date(d).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function jr(d){return new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function bar(p,c){return '<div class="'+c+'"><div class="bar"><div class="h" style="width:'+p[0]+'%">'+p[0]+' %</div><div class="d" style="width:'+p[1]+'%">'+p[1]+' %</div><div class="a" style="width:'+p[2]+'%">'+p[2]+' %</div></div></div>'}
function badges(l){return l.map(function(x){return '<span class="b '+esc(x)+'">'+esc(x)+'</span>'}).join("")||"—"}
function libIssue(i){return i=="dom"?"Victoire domicile":i=="ext"?"Victoire extérieur":"Match nul"}
function libSrc(s){return s=="actuelle"?"données actuelles":"données 2022-2024"}

function majOnglets(){
document.getElementById("tab-j").className=vue=="jour"?"on":"";
document.getElementById("tab-r").className=vue=="res"?"on":"";
}
document.getElementById("tab-j").onclick=function(){vue="jour";majOnglets();rendre()};
document.getElementById("tab-r").onclick=function(){vue="res";majOnglets();rendre()};

function rendre(){ vue=="jour" ? home() : resultats() }

function home(){
if(!D||!D.matchs.length){app.innerHTML='<h1>Matchs du jour</h1><p class="sub">Aucun match analysé pour le moment (pause du championnat, ou tous les matchs sont déjà passés). Reviens plus tard.</p>';return}
var d=new Date(D.maj).toLocaleString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
var h='<h1>Matchs du jour</h1><p class="sub">'+D.matchs.length+' matchs analysés · mis à jour le '+esc(d)+'</p>';
D.matchs.forEach(function(m,i){
h+='<button class="m" data-i="'+i+'"><span class="meta"><span>'+esc(m.competition)+'</span><span>'+hr(m.heure)+'</span></span>';
if(m.categorie=="secondaire")h+='<span class="mini sec">Compétition secondaire</span><br>';
h+='<div class="t">'+esc(m.domicile)+' – '+esc(m.exterieur)+'</div>'+bar(m.proba,"sm")+'</button>';
});
app.innerHTML=h;
app.querySelectorAll(".m").forEach(function(b){b.onclick=function(){detail(+b.dataset.i)}});
}

function detail(i){
var m=D.matchs[i],f=m.face_a_face;
var h='<button class="back" id="bk">← Tous les matchs</button>';
if(m.categorie=="secondaire")h+='<span class="mini sec">Compétition secondaire</span>';

'<div class="legend"><span><b>'+esc(m.domicile)+'</b> gagne</span><span>Nul</span><span><b>'+esc(m.exterieur)+'</b> gagne</span></div>'+
'<h2>5 derniers matchs</h2>'+
'<div class="p"><div class="row"><span>'+esc(m.domicile)+'</span><span>'+badges(m.forme_dom)+'</span></div>'+(m.source_dom?'<div class="note" style="margin:6px 0 0"><span class="src '+m.source_dom+'">'+libSrc(m.source_dom)+'</span></div>':'')+'</div>'+
'<div class="p"><div class="row"><span>'+esc(m.exterieur)+'</span><span>'+badges(m.forme_ext)+'</span></div>'+(m.source_ext?'<div class="note" style="margin:6px 0 0"><span class="src '+m.source_ext+'">'+libSrc(m.source_ext)+'</span></div>':'')+'</div>'+
'<h2>Confrontations directes (5 dernières)</h2><div class="p">'+esc(m.domicile)+' : '+f.dom+' victoire(s) · nuls : '+f.nuls+' · '+esc(m.exterieur)+' : '+f.ext+' victoire(s)</div>'+
'<h2>Joueurs absents ou incertains</h2>';
if(!m.absents.length)h+='<p class="note">Aucun joueur signalé pour ce match.</p>';
m.absents.forEach(function(a){h+='<div class="p"><div class="row"><span><b>'+esc(a.joueur)+'</b><br><span class="note">'+esc(a.equipe)+(a.raison?' · '+esc(a.raison):'')+'</span></span><b>'+esc(a.statut)+'</b></div></div>'});
h+='
