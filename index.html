<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B1640">
<title>Prédictions Foot</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0B1640;--card:#132060;--cell:#0A143F;--line:#233275;--ink:#FFFFFF;--muted:#A9B4DE;--acc:#3DDC97;--home:#3DDC97;--draw:#3B4C98;--away:#FF6F6F;--ok:#3DDC97;--mid:#FFC857;--bad:#FF6F6F;--lock:#3DDC97}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:18px 18px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar span{font-weight:800}
.topbar a{color:var(--muted);font-size:.85rem;text-decoration:none;border:1px solid var(--line);padding:6px 11px;border-radius:99px}
h1{font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.1;margin:20px 0 4px}
h2{font-size:1.08rem;margin:26px 0 10px}
.sub,.note{color:var(--muted);font-size:.9rem;margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
nav{display:flex;gap:8px;margin:14px 0}
nav button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font-weight:700}
nav button.on{background:var(--acc);color:#0B1640;border-color:var(--acc)}
.score{display:flex;align-items:baseline;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.score b{font-size:2.2rem;color:var(--acc)}
.m{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;position:relative;color:var(--ink)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}
.t{font-weight:800;font-size:1.05rem;margin:2px 0 8px}
.mini{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;margin:6px 6px 4px 0}
.mini.sec{background:var(--draw);color:var(--ink)}
.mini.lock{background:var(--lock);color:#0B1640}
.bar{display:flex;overflow:hidden;border-radius:8px;background:var(--line);height:26px;font-size:.85rem}
.lg .bar{height:54px;font-size:1.05rem}
.bar div{display:flex;align-items:center;justify-content:center;color:#0B1640;font-weight:800;white-space:nowrap;min-width:32px;flex-shrink:0}
.h{background:var(--home)}.d{background:var(--draw);color:#fff!important}.a{background:var(--away)}
.blur{filter:blur(6px);pointer-events:none;user-select:none}
.upsell{background:var(--card);border:1px dashed var(--lock);border-radius:14px;padding:18px;margin:14px 0;text-align:center}
.upsell b{display:block;margin-bottom:8px}
.upsell a{display:inline-block;padding:12px 20px;border-radius:10px;background:var(--lock);color:#0B1640;font-weight:800;text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;font-size:.9rem;margin-top:8px;color:var(--muted)}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--muted);margin-top:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.b{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;color:#fff;font-weight:700;font-size:.8rem;margin-right:4px}
.V{background:var(--ok);color:#0B1640}.N{background:var(--mid);color:#0B1640}.D{background:var(--bad);color:#0B1640}
.src{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px}
.src.actuelle{background:var(--ok);color:#0B1640}.src.historique{background:var(--mid);color:#0B1640}
.tag{font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:99px}
.tag.ok{background:var(--ok);color:#0B1640}.tag.bad{background:var(--bad);color:#0B1640}
.warn{margin-top:28px;padding:14px 16px;border-left:4px solid var(--acc);background:var(--card);font-size:.9rem;border-radius:0 12px 12px 0}
.hero{background:linear-gradient(180deg,#1B2A78 0%,#132060 100%);border:1px solid var(--line);border-radius:18px;padding:16px 12px 14px;margin:12px 0}
.hero .lg1{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:14px}
.vs{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.tm{flex:1;min-width:0;text-align:center}
.tm .nom{display:block;margin-top:8px;font-weight:800;font-size:.98rem;line-height:1.2;overflow-wrap:anywhere}
.ecu{display:inline-flex;width:56px;height:56px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.05rem;border:2px solid rgba(255,255,255,.16)}
.mid{flex:0 0 auto;text-align:center;padding-top:6px}
.mid b{display:block;font-size:1.55rem}
.mid small{color:var(--muted)}
.cd{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:14px;color:var(--muted);font-size:.82rem}
.cd b{background:#08112F;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--ink);font-size:1.05rem;font-variant-numeric:tabular-nums}
.xg{text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px}
.xg b{color:var(--ink)}
.x3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 6px}
.x3 .cell{flex-direction:column;align-items:flex-start;justify-content:center;min-height:74px}
.x3 .cell .pc{font-size:1.5rem}
.cell{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:11px 12px;overflow:hidden;min-height:50px}
.cell .lb{color:var(--muted);font-size:.8rem;line-height:1.25;overflow-wrap:anywhere}
.cell .pc{font-weight:800;font-size:1rem;white-space:nowrap}
.cell i{position:absolute;left:0;bottom:0;height:3px;background:var(--muted);opacity:.45}
.cell.best{border-color:var(--acc)}
.cell.best .pc{color:var(--acc)}
.cell.best i{background:var(--acc);opacity:1}
.fams{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 18px;margin:0 -18px;scrollbar-width:none}
.fams::-webkit-scrollbar{display:none}
.fam{flex:0 0 auto;padding:9px 16px;border:0;border-radius:99px;background:var(--card);color:var(--muted);font-weight:700;font-size:.9rem}
.fam.on{background:var(--acc);color:#0B1640}
.mk{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.mk summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.mk summary::-webkit-details-marker{display:none}
.mk summary::after{content:"▾";color:var(--muted);font-weight:400}
.mk[open] summary::after{content:"▴"}
.nm1{flex:1;min-width:0}
.fia{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:8px;white-space:nowrap;color:#0B1640}
.fia.Bonne{background:var(--ok)}.fia.Moyenne{background:var(--mid)}.fia.Faible{background:var(--bad)}
.est{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--draw);color:var(--ink);margin-left:8px;white-space:nowrap}
.g{display:grid;gap:8px;padding:0 12px 12px}
.g.c1{grid-template-columns:1fr}
.g.c2{grid-template-columns:1fr 1fr}
.g.c3{grid-template-columns:repeat(3,1fr)}
.g.c3 .cell{flex-direction:column;align-items:flex-start;justify-content:center}
</style>
</head>
<body>
<main id="main" style="display:none">
<div class="topbar">
<span>Prédictions Foot</span>
<span style="display:flex;gap:8px">
<a href="accueil.html">Mon compte</a>
<a href="#" id="deconnexion">Se déconnecter</a>
</span>
</div>
<nav>
<button id="tab-j" class="on">Matchs du jour</button>
<button id="tab-r">Résultats</button>
</nav>
<div id="app"><p class="sub">Chargement…</p></div>
<div class="warn"><b>Une prédiction est une probabilité, pas une certitude.</b> Le football reste imprévisible. Ces chiffres ne sont pas un conseil de paris.</div>
</main>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBkxmxGehi3FAl5wnncb9jYFAJ78Xq4NkM",
  authDomain: "vm-r-pronostic-football.firebaseapp.com",
  projectId: "vm-r-pronostic-football",
  storageBucket: "vm-r-pronostic-football.firebasestorage.app",
  messagingSenderId: "608079906919",
  appId: "1:608079906919:web:e3c10aad785303bd946cc2"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var ABONNE = false, PAYWALL = false; // PAYWALL = true réactivera plus tard les cadenas et l'abonnement

auth.onAuthStateChanged(function(u){
  if(!u){ window.location.href = "connexion.html"; return; }
  document.getElementById("main").style.display = "block";
  chargerDonnees();
});

document.getElementById("deconnexion").onclick = function(e){
  e.preventDefault();
  auth.signOut();
};

var D=null,app=document.getElementById("app"),vue="jour";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hr(d){return new Date(d).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function jr(d){return new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function bar(p,c){return '<div class="'+c+'"><div class="bar"><div class="h" style="flex:'+p[0]+' 1 0">'+p[0]+' %</div><div class="d" style="flex:'+p[1]+' 1 0">'+p[1]+' %</div><div class="a" style="flex:'+p[2]+' 1 0">'+p[2]+' %</div></div></div>'}
function badges(l){return l.map(function(x){return '<span class="b '+esc(x)+'">'+esc(x)+'</span>'}).join("")||"—"}
function libIssue(i){return i=="dom"?"Victoire domicile":i=="ext"?"Victoire extérieur":"Match nul"}
function libSrc(s){return s=="actuelle"?"données actuelles":"données 2022-2024"}
function verrouille(m){ return PAYWALL && Math.max.apply(null,m.proba) >= 50 && !ABONNE; }

function majOnglets(){
document.getElementById("tab-j").className=vue=="jour"?"on":"";
document.getElementById("tab-r").className=vue=="res"?"on":"";
}
document.getElementById("tab-j").onclick=function(){vue="jour";majOnglets();rendre()};
document.getElementById("tab-r").onclick=function(){vue="res";majOnglets();rendre()};

function rendre(){ vue=="jour" ? home() : resultats() }

function home(){clearInterval(cd);
if(!D||!D.matchs.length){app.innerHTML='<h1>Matchs du jour</h1><p class="sub">Aucun match analysé pour le moment (pause du championnat, ou tous les matchs sont déjà passés). Reviens plus tard.</p>';return}
var d=new Date(D.maj).toLocaleString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
var h='<h1>Matchs du jour</h1><p class="sub">'+D.matchs.length+' matchs analysés · mis à jour le '+esc(d)+'</p>';
D.matchs.forEach(function(m,i){
var verr = verrouille(m);
h+='<button class="m" data-i="'+i+'"><span class="meta"><span>'+esc(m.competition)+'</span><span>'+hr(m.heure)+'</span></span>';
if(m.categorie=="secondaire")h+='<span class="mini sec">Compétition secondaire</span>';
if(verr)h+='<span class="mini lock">🔒 Réservé aux abonnés</span>';
h+='<br><div class="t">'+esc(m.domicile)+' – '+esc(m.exterieur)+'</div>'+bar(m.proba,"sm"+(verr?" blur":""))+'</button>';
});
app.innerHTML=h;
app.querySelectorAll(".m").forEach(function(b){b.onclick=function(){detail(+b.dataset.i)}});
}

var famActive="Résultat",cd=null;
function fmt(p){return (p>=10?String(Math.round(p)):String(Math.round(p*10)/10)).replace(".",",")}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1).replace(".",",")}
function p2(n){return n<10?"0"+n:String(n)}
function nomEq(t,m){return String(t).replace(/Domicile/g,function(){return m.domicile}).replace(/Extérieur/g,function(){return m.exterieur}).replace(/(\d)\.(\d)/g,"$1,$2")}
function ecu(n){
var mots=String(n).replace(/[^\p{L}\p{N} ]/gu,"").trim().split(/\s+/).filter(Boolean);
var s=mots.length>1?(mots[0].charAt(0)+mots[1].charAt(0)):String(mots[0]||"?").slice(0,2);
var hu=0;for(var i=0;i<String(n).length;i++)hu=(hu*31+String(n).charCodeAt(i))%360;
return '<span class="ecu" style="background:hsl('+hu+',55%,42%)">'+esc(s.toUpperCase())+'</span>';
}
function lancerCd(m){
var el=document.getElementById("cd");if(!el)return;
var t=new Date(m.heure).getTime();
if(isNaN(t)){el.innerHTML="";return}
function tick(){
var s=Math.floor((t-Date.now())/1000);
if(s<=0){el.innerHTML='<span>Match commencé ou terminé</span>';clearInterval(cd);return}
el.innerHTML='<span>Démarre dans</span><b>'+p2(Math.floor(s/3600))+'</b>:<b>'+p2(Math.floor(s%3600/60))+'</b>:<b>'+p2(s%60)+'</b>';
}
tick();cd=setInterval(tick,1000);
}
function marchesHtml(m){
if(!m.marches||!m.marches.length)return "";
var fams=[];
m.marches.forEach(function(x){if(fams.indexOf(x.groupe)<0)fams.push(x.groupe)});
if(fams.indexOf(famActive)<0)famActive=fams[0];
var h='<h2>Tous les marchés</h2><p class="note" style="margin-bottom:0">Probabilités estimées par notre modèle. « Fiabilité » = mesurée sur des milliers de matchs passés ; sans indication, le marché n\'a pas encore été mesuré. « estimation » = calcul plus approximatif.</p><div class="fams">';
fams.forEach(function(f){h+='<button class="fam'+(f==famActive?' on':'')+'" data-fam="'+esc(f)+'">'+esc(f)+'</button>'});
h+='</div>';
var liste=m.marches.filter(function(x){return x.groupe==famActive&&x.nom!="Résultat du match (1X2)"});
liste.forEach(function(x,k){
var best=0,maxL=0;
x.issues.forEach(function(s,j){if(s.p>x.issues[best].p)best=j;maxL=Math.max(maxL,nomEq(s.n,m).length)});
var cols=(x.issues.length>=3&&maxL<=11)?"c3":(maxL<=24?"c2":"c1");
h+='<details class="mk"'+(k<2?' open':'')+'><summary><span class="nm1">'+esc(nomEq(x.nom,m))+(x.approx?'<span class="est">estimation</span>':'')+(x.fiab?'<span class="fia '+esc(x.fiab)+'">Fiabilité '+esc(x.fiab.toLowerCase())+'</span>':'')+'</span></summary><div class="g '+cols+'">';
x.issues.forEach(function(s,j){h+='<div class="cell'+(j==best?' best':'')+'"><span class="lb">'+esc(nomEq(s.n,m))+'</span><span class="pc">'+fmt(s.p)+' %</span><i style="width:'+Math.min(100,s.p)+'%"></i></div>'});
h+='</div></details>';
});
return h;
}
function brancherMarches(m){
var c=document.getElementById("mkt");if(!c)return;
c.querySelectorAll(".fam").forEach(function(b){b.onclick=function(){famActive=b.getAttribute("data-fam");c.innerHTML=marchesHtml(m);brancherMarches(m)}});
}
function methodeTxt(m){
var aj=m.ajustement||0;
if(!m.buts_attendus)return "Méthode : probabilités estimées à partir de la forme récente et des confrontations directes.";
return "Méthode : on estime les buts que chaque équipe devrait marquer ("+fmt1(m.buts_attendus[0])+" et "+fmt1(m.buts_attendus[1])+"), d'après leurs buts marqués et encaissés, puis on calcule la probabilité de chaque score et de chaque marché. Base du 1X2 : "+m.base_api.join(" / ")+" (domicile / nul / extérieur), puis ajustement selon la forme et les confrontations directes ("+(aj>0?"+":"")+aj+" pts). Les marchés « estimation » appliquent la répartition moyenne des buts dans le temps. Les blessures ne sont pas prises en compte. Banc d'essai sur 3 802 matchs passés de 8 championnats : bon résultat trouvé dans environ 49 % des cas (toujours « domicile » : 43 %, cotes des bookmakers : 53 %).";
}

function detail(i){
clearInterval(cd);
var m=D.matchs[i],f=m.face_a_face;
if(verrouille(m)){
app.innerHTML='<button class="back" id="bk">← Tous les matchs</button><h1>'+esc(m.domicile)+' – '+esc(m.exterieur)+'</h1><p class="sub">'+esc(m.competition)+' · coup d\'envoi '+hr(m.heure)+'</p>'+
'<div class="upsell"><b>🔒 Ce pronostic est réservé aux abonnés</b><p class="note">Ce match dépasse 50 % de confiance dans notre modèle. Abonne-toi pour le débloquer, ainsi que tous les autres.</p><a href="accueil.html">Voir l\'abonnement</a></div>';
window.scrollTo(0,0);
document.getElementById("bk").onclick=function(){vue="jour";rendre()};
return;
}
var meilleur=m.proba.indexOf(Math.max.apply(null,m.proba));
var noms=[m.domicile,"Nul",m.exterieur];
var h='<button class="back" id="bk">← Tous les matchs</button>';
h+='<div class="hero"><div class="lg1">'+esc(m.competition)+(m.categorie=="secondaire"?' · compétition secondaire':'')+'</div>'+
'<div class="vs"><div class="tm">'+ecu(m.domicile)+'<span class="nom">'+esc(m.domicile)+'</span></div>'+
'<div class="mid"><b>'+hr(m.heure)+'</b><small>'+jr(m.heure)+'</small></div>'+
'<div class="tm">'+ecu(m.exterieur)+'<span class="nom">'+esc(m.exterieur)+'</span></div></div>'+
'<div class="cd" id="cd"></div>'+
(m.buts_attendus?'<div class="xg">Buts attendus : <b>'+fmt1(m.buts_attendus[0])+'</b> – <b>'+fmt1(m.buts_attendus[1])+'</b></div>':'')+'</div>';
h+='<div class="x3">';
for(var k=0;k<3;k++)h+='<div class="cell'+(k==meilleur?' best':'')+'"><span class="lb">'+esc(noms[k])+(k==1?'':' gagne')+'</span><span class="pc">'+m.proba[k]+' %</span><i style="width:'+m.proba[k]+'%"></i></div>';
h+='</div>';
h+='<div id="mkt">'+marchesHtml(m)+'</div>';
h+='<h2>5 derniers matchs</h2>'+
'<div class="p"><div class="row"><span>'+esc(m.domicile)+'</span><span>'+badges(m.forme_dom)+'</span></div>'+(m.source_dom?'<div class="note" style="margin:6px 0 0"><span class="src '+m.source_dom+'">'+libSrc(m.source_dom)+'</span></div>':'')+'</div>'+
'<div class="p"><div class="row"><span>'+esc(m.exterieur)+'</span><span>'+badges(m.forme_ext)+'</span></div>'+(m.source_ext?'<div class="note" style="margin:6px 0 0"><span class="src '+m.source_ext+'">'+libSrc(m.source_ext)+'</span></div>':'')+'</div>'+
'<h2>Confrontations directes (5 dernières)</h2><div class="p">'+esc(m.domicile)+' : '+f.dom+' victoire(s) · nuls : '+f.nuls+' · '+esc(m.exterieur)+' : '+f.ext+' victoire(s)</div>';
h+='<p class="note" style="margin-top:14px">'+esc(methodeTxt(m))+'</p>';
app.innerHTML=h;brancherMarches(m);lancerCd(m);window.scrollTo(0,0);
document.getElementById("bk").onclick=function(){vue="jour";rendre()};
}

function jourLabel(d){
var dt=new Date(d),auj=new Date(),hier=new Date(auj);hier.setDate(auj.getDate()-1);
var m=function(a,b){return a.toDateString()==b.toDateString()};
if(m(dt,auj))return "Aujourd'hui";
if(m(dt,hier))return "Hier";
return dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
function butsHtml(m){
if(!m.buteurs||!m.buteurs.length)return "";
var dom=m.buteurs.filter(function(b){return b.equipe==m.domicile});
var ext=m.buteurs.filter(function(b){return b.equipe==m.exterieur});
function lig(b){return b.joueur+" "+b.minute+"'"+(b.prolongation?("+"+b.prolongation):"")}
var h='<div class="note" style="margin-top:6px">';
if(dom.length)h+='<div>'+esc(m.domicile)+' : '+dom.map(lig).map(esc).join(", ")+'</div>';
if(ext.length)h+='<div>'+esc(m.exterieur)+' : '+ext.map(lig).map(esc).join(", ")+'</div>';
h+='</div>';
return h;
}
var dossierOuvert=null;

function grouperParJour(){
var groupes={},ordreJours=[];
(D.historique||[]).forEach(function(x,i){
x._i=i;
var lbl=jourLabel(x.date);
if(!groupes[lbl]){groupes[lbl]=[];ordreJours.push(lbl)}
groupes[lbl].push(x);
});
return {groupes:groupes,ordre:ordreJours};
}

function resultats(){clearInterval(cd);
dossierOuvert=null;
var h='<h1>Résultats</h1><p class="sub">Efficacité des prédictions passées de ce site.</p>';
if(D.taux_reussite==null){h+='<p class="sub">Pas encore assez de matchs terminés pour calculer un taux.</p>';app.innerHTML=h;return}
h+='<div class="score"><b>'+D.taux_reussite+' %</b><span>de bons pronostics sur les '+D.nb_verifies+' derniers matchs vérifiés (toutes dates confondues)</span></div>';
var g=grouperParJour();
h+='<h2>Par date</h2>';
g.ordre.forEach(function(lbl){
var liste=g.groupes[lbl];
var bons=liste.filter(function(x){var ordre=["dom","nul","ext"];return ordre[x.proba.indexOf(Math.max.apply(null,x.proba))]==x.resultat_reel}).length;
h+='<button class="m" data-dossier="'+esc(lbl)+'"><div class="row"><span><b>'+esc(lbl)+'</b><br><span class="note">'+liste.length+' match(s) vérifié(s)</span></span><span class="tag '+(bons==liste.length?'ok':'bad')+'">'+bons+'/'+liste.length+' ✓</span></div></button>';
});
app.innerHTML=h;window.scrollTo(0,0);
app.querySelectorAll(".m[data-dossier]").forEach(function(b){b.onclick=function(){resultatsJour(b.dataset.dossier)}});
}

function resultatsJour(lbl){
dossierOuvert=lbl;
var g=grouperParJour();
var h='<button class="back" id="bk">← Par date</button><h1>'+esc(lbl)+'</h1><p class="sub">Résultats de ce jour.</p>';
(g.groupes[lbl]||[]).forEach(function(x){
var ordre=["dom","nul","ext"],meilleur=ordre[x.proba.indexOf(Math.max.apply(null,x.proba))];
var bon=meilleur==x.resultat_reel;
var scoreTxt=x.score?(' · '+x.score[0]+' - '+x.score[1]):'';
h+='<button class="m" data-ri="'+x._i+'"><div class="row"><span><b>'+esc(x.domicile)+' – '+esc(x.exterieur)+'</b><br><span class="note">prédit : '+libIssue(meilleur)+' ('+x.proba[ordre.indexOf(meilleur)]+' %)'+scoreTxt+'</span></span><span class="tag '+(bon?'ok':'bad')+'">'+(bon?'✓ ':'✗ ')+esc(libIssue(x.resultat_reel))+'</span></div></button>';
});
app.innerHTML=h;window.scrollTo(0,0);
document.getElementById("bk").onclick=function(){resultats()};
app.querySelectorAll(".m[data-ri]").forEach(function(b){b.onclick=function(){detailResultat(+b.dataset.ri)}});
}

function detailResultat(i){
var x=D.historique[i];
var ordre=["dom","nul","ext"],meilleur=ordre[x.proba.indexOf(Math.max.apply(null,x.proba))];
var bon=meilleur==x.resultat_reel;
var h='<button class="back" id="bk">← Tous les résultats</button>';
h+='<h1>'+esc(x.domicile)+' – '+esc(x.exterieur)+'</h1><p class="sub">'+jr(x.date)+' à '+hr(x.date)+'</p>';
if(x.score)h+='<div class="score"><b>'+x.score[0]+' - '+x.score[1]+'</b><span>Score final</span></div>';
h+=bar(x.proba,"lg");
h+='<div class="legend"><span><b>'+esc(x.domicile)+'</b> gagne</span><span>Nul</span><span><b>'+esc(x.exterieur)+'</b> gagne</span></div>';
h+='<h2>Buteurs</h2>';
if(x.buteurs&&x.buteurs.length){h+=butsHtml(x)}
else if(x.score&&(x.score[0]+x.score[1])>0){h+='<p class="note">Détail des buteurs non disponible pour ce match.</p>'}
else{h+='<p class="note">Aucun but marqué dans ce match.</p>'}
h+='<h2>Notre prédiction</h2><div class="p"><div class="row"><span>Meilleur pari : '+libIssue(meilleur)+' ('+x.proba[ordre.indexOf(meilleur)]+' %)</span><span class="tag '+(bon?'ok':'bad')+'">'+(bon?'✓ Correct':'✗ Incorrect')+'</span></div></div>';
app.innerHTML=h;window.scrollTo(0,0);
document.getElementById("bk").onclick=function(){vue="res";if(dossierOuvert){resultatsJour(dossierOuvert)}else{resultats()}};
}

function chargerDonnees(){
fetch("data.json?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){D=j;rendre()}).catch(function(){app.innerHTML='<h1>Matchs du jour</h1><p class="sub">Les données ne sont pas encore prêtes. Reviens un peu plus tard.</p>'});
}
</script>
</body>
</html>
