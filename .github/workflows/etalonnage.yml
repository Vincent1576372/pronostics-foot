name: Banc d'essai
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: donnees
  cancel-in-progress: false
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python etalonnage.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add etalonnage.md etalonnage.json
          git commit -m "Banc d'essai du modèle" || exit 0
          git pull --rebase origin main
          git push
